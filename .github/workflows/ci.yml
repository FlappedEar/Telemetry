name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs the Flutter version pinned in pubspec.yaml and verifies the
      # archive's SHA-256 (see .github/actions/setup-flutter).
      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get
      # Nested pure Dart packages need their dependencies before the root
      # analysis, which covers them too.
      - name: Packages - pub get
        working-directory: packages/fetproject
        run: dart pub get
      - run: flutter analyze
      - run: flutter test
      - name: Packages - analyze and test
        working-directory: packages/fetproject
        run: |
          dart analyze --fatal-infos
          dart test
      - name: Build macOS (debug)
        run: flutter build macos --debug

  telemetry-core:
    name: telemetry_core (Dart, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/telemetry_core
    steps:
      - uses: actions/checkout@v4
      # The Dart SDK that ships with the Flutter version pinned in pubspec.yaml.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # Builds the iOS app for the simulator and runs the integration tests on a
  # booted iPhone simulator, so iOS native code is compiled and launched.
  ios-simulator:
    name: iOS simulator (build and integration test)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Build iOS (simulator, debug)
        run: flutter build ios --simulator --debug
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True,
                       key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("No available iPhone simulator")
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Integration tests on the simulator
        run: flutter test integration_test -d "${{ steps.simulator.outputs.udid }}"

  # Builds the Android APK and runs the integration tests on an Android
  # emulator (x86_64, hardware accelerated with KVM).
  android-emulator:
    name: Android emulator (build and integration test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Build Android APK (debug)
        run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Apache-2.0, ReactiveCircus/android-emulator-runner.
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: flutter test integration_test -d emulator-5554
