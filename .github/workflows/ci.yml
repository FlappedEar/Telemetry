name: CI

on:
  pull_request:
  # Entries in main's merge queue run the same checks before they merge.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs the Flutter version pinned in pubspec.yaml and verifies the
      # archive's SHA-256 (see .github/actions/setup-flutter).
      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get
      # Nested pure Dart packages need their dependencies before the root
      # analysis, which covers them too.
      - name: Packages - pub get
        working-directory: packages/fetproject
        run: dart pub get
      - run: flutter analyze
      - run: flutter test
      - name: Packages - analyze and test
        working-directory: packages/fetproject
        run: |
          dart analyze --fatal-infos
          dart test
      # Satellite tiles need the MapTiler key, given to builds with
      # --dart-define and never stored in the repository. This only reports
      # whether the key works; without it the app shows street tiles.
      - name: Check the MapTiler key
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::warning::MAPTILER_KEY is not available to this run; builds show street tiles only."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.maptiler.com/maps/satellite/256/2/2/1.jpg?key=$MAPTILER_KEY")
          echo "MapTiler satellite tile: HTTP $code"
          [ "$code" = 200 ] || echo "::warning::The MapTiler satellite tile request returned HTTP $code."
      - name: Build macOS (debug)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: flutter build macos --debug --dart-define=MAPTILER_KEY="$MAPTILER_KEY"

  telemetry-core:
    name: telemetry_core (Dart, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/telemetry_core
    steps:
      - uses: actions/checkout@v4
      # The Dart SDK that ships with the Flutter version pinned in pubspec.yaml.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # Builds the iOS app for the simulator and runs the integration tests on a
  # booted iPhone simulator, so iOS native code is compiled and launched.
  ios-simulator:
    name: iOS simulator (build and integration test)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Build iOS (simulator, debug)
        run: flutter build ios --simulator --debug
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True,
                       key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("No available iPhone simulator")
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # flutter test starts reading the simulator log only after it launches
      # the app, so it can miss the line with the Dart VM service URL and wait
      # for it forever ("Waiting for VM Service port to be available"). That
      # attempt is stopped after 15 minutes and run once more; any other
      # failure, including a failing test, fails the step at once. On failure
      # the verbose tool log and the simulator's log for the app are printed.
      - name: Integration tests on the simulator
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          for attempt in 1 2; do
            # macOS has no timeout(1); perl's alarm does the same.
            status=0
            perl -e 'alarm shift; exec @ARGV' 900 flutter test integration_test -d "$udid" -v > integration.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              tail -n 40 integration.log
              exit 0
            fi
            if [ "$attempt" -eq 1 ] \
              && grep -q 'Waiting for VM Service port to be available' integration.log \
              && ! grep -q 'connected to test device' integration.log; then
              echo "::warning::flutter test missed the app's VM service URL (attempt $attempt); running it again."
              continue
            fi
            tail -n 300 integration.log
            xcrun simctl spawn "$udid" log show --last 15m --style compact \
              --predicate 'process == "Runner"' | tail -n 200
            exit "$status"
          done

  # Builds the Android APK and runs the integration tests on an Android
  # emulator (x86_64, hardware accelerated with KVM).
  android-emulator:
    name: Android emulator (build and integration test)
    runs-on: ubuntu-latest
    # The build and unit tests, then up to two 15-minute test attempts.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The APK's build number is the commit count (see below).
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      # The release APK is the one to sideload on a phone or tablet. It is
      # signed with the debug key (android/app/build.gradle.kts). The key is
      # kept in the Actions cache, so APKs from later main builds install as
      # updates and keep the app's data; the key never enters the repository.
      # Caches from main are shared with pull requests; a cache unused for
      # seven days expires, and the next build makes a new key.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      # The Android Gradle plugin reads the debug key from
      # $ANDROID_USER_HOME/debug.keystore. On the runner that was not
      # ~/.android, so the cache never had a key to save and every APK was
      # signed with a new one. Make the key here, where the cache keeps it,
      # unless the cache restored it.
      - name: Make the signing key if the cache had none
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "::warning::No cached signing key; making a new one. APKs from this build do not install over earlier ones."
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      # MAPTILER_KEY gives the sideloaded app its satellite map tiles (FET-27).
      # The build number (Android versionCode) is the commit count, as in
      # release.yml, so a later build from main or a release installs over an
      # earlier one and Android never sees a downgrade.
      - name: Build Android APK (release, sideloadable)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          flutter build apk --release --build-number="$(git rev-list --count HEAD)" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
      # JVM unit tests of the native code (android/app/src/test), such as the
      # bounded copy of shared and picked files. The APK build made gradlew.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      # Fails if the APK was signed with any key but the cached one.
      - name: Check the APK's signing key
        run: |
          expected=$(keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          # Newer build tools may need a newer Java than the build's 17.
          java_home="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          certs=$(JAVA_HOME="$java_home" PATH="$java_home/bin:$PATH" "$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk 2>&1) || true
          actual=$(printf '%s\n' "$certs" \
            | sed -n -E 's/^(Signer #1|V[0-9]+ Signer):? certificate SHA-256 digest: //p' \
            | head -n 1)
          echo "Signing key SHA-256: $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            printf '%s\n' "$certs"
            echo "::error::The APK is signed with '$actual', not the cached key $expected."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: flappedear-telemetry-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Apache-2.0, ReactiveCircus/android-emulator-runner.
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # The guest has no Vulkan, so Flutter draws with OpenGL ES on
          # SwiftShader instead of SwiftShader's emulated Vulkan; runs that
          # never got past the splash screen had the emulated Vulkan.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/android-integration-test.sh
