name: CI

on:
  pull_request:
  # Entries in main's merge queue run the same checks before they merge.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Every revision of
# main runs to the end in its own group: AGENTS.md requires green CI on each
# resulting main revision, so a quick second merge must not cancel the first.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze-and-test:
    name: Analyze and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs the Flutter version pinned in pubspec.yaml and verifies the
      # archive's SHA-256 (see .github/actions/setup-flutter).
      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get
      # Nested pure Dart packages need their dependencies before the root
      # analysis, which covers them too.
      - name: Packages - pub get
        working-directory: packages/fetproject
        run: dart pub get
      - run: flutter analyze
      - run: flutter test
      - name: Packages - analyze and test
        working-directory: packages/fetproject
        run: |
          dart analyze --fatal-infos
          dart test
      # Satellite tiles need the MapTiler key, given to builds with
      # --dart-define and never stored in the repository. This only reports
      # whether the key works; without it the app shows street tiles.
      - name: Check the MapTiler key
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::warning::MAPTILER_KEY is not available to this run; builds show street tiles only."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.maptiler.com/maps/satellite/256/2/2/1.jpg?key=$MAPTILER_KEY")
          echo "MapTiler satellite tile: HTTP $code"
          [ "$code" = 200 ] || echo "::warning::The MapTiler satellite tile request returned HTTP $code."
      - name: Build macOS (debug)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: flutter build macos --debug --dart-define=MAPTILER_KEY="$MAPTILER_KEY"

  # Windows is a target platform: analyze, test and build it like macOS.
  windows:
    name: Analyze, test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Packages - pub get
        working-directory: packages/fetproject
        run: dart pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows (release)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: flutter build windows --release --dart-define=MAPTILER_KEY="$MAPTILER_KEY"

  telemetry-core:
    name: telemetry_core (Dart, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/telemetry_core
    steps:
      - uses: actions/checkout@v4
      # The Dart SDK that ships with the Flutter version pinned in pubspec.yaml.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # Builds the iOS app for the simulator and runs the integration tests on a
  # booted iPhone simulator, so iOS native code is compiled and launched.
  ios-simulator:
    name: iOS simulator (build and integration test)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Build iOS (simulator, debug)
        run: flutter build ios --simulator --debug
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True,
                       key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("No available iPhone simulator")
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # flutter test starts reading the simulator log only after it launches
      # the app, so it can miss the line with the Dart VM service URL and wait
      # for it forever ("Waiting for VM Service port to be available"). The
      # tool prints that line after the build and launch, and a healthy app
      # answers within seconds, so an attempt still waiting 3 minutes later is
      # stopped and run again, up to three attempts (almost half of the runs
      # on 2026-10-04 hit this, and each waited the whole 15-minute limit).
      # Each attempt also stops after 15 minutes. Any other failure, including
      # a failing test, fails the step at once. On failure the verbose tool
      # log and the simulator's log for the app are printed.
      - name: Integration tests on the simulator
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          stall_limit=180
          for attempt in 1 2 3; do
            # macOS has no timeout(1); perl's alarm does the same.
            status=0
            # Empty the log first, so the checks below never read the last
            # attempt's lines.
            : > integration.log
            perl -e 'alarm shift; exec @ARGV' 900 flutter test integration_test -d "$udid" -v > integration.log 2>&1 &
            test_pid=$!
            waiting_since=
            while kill -0 "$test_pid" 2>/dev/null; do
              if grep -q 'connected to test device' integration.log; then
                waiting_since=
              elif [ -z "$waiting_since" ] \
                && grep -q 'Waiting for VM Service port to be available' integration.log; then
                waiting_since=$(date +%s)
              fi
              if [ -n "$waiting_since" ] \
                && [ $(($(date +%s) - waiting_since)) -ge "$stall_limit" ] \
                && ! grep -q 'connected to test device' integration.log; then
                echo "::warning::Still waiting for the app's VM service after ${stall_limit}s (attempt $attempt); stopping it."
                kill "$test_pid" 2>/dev/null || true
                break
              fi
              sleep 5
            done
            wait "$test_pid" || status=$?
            if [ "$status" -eq 0 ]; then
              tail -n 40 integration.log
              exit 0
            fi
            if [ "$attempt" -lt 3 ] \
              && grep -q 'Waiting for VM Service port to be available' integration.log \
              && ! grep -q 'connected to test device' integration.log; then
              echo "::warning::flutter test missed the app's VM service URL (attempt $attempt); running it again."
              continue
            fi
            tail -n 300 integration.log
            xcrun simctl spawn "$udid" log show --last 15m --style compact \
              --predicate 'process == "Runner"' | tail -n 200
            exit "$status"
          done

  # Builds the Android APK and runs the integration tests on an Android
  # emulator (x86_64, hardware accelerated with KVM).
  android-emulator:
    name: Android emulator (build and integration test)
    runs-on: ubuntu-latest
    # The build and unit tests, then up to three test attempts (one that
    # connects but stalls stops after 4 minutes, any attempt after 15).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The APK's build number is the commit count (see below).
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      # CI APKs are signed with a throwaway key made for this run (the Android
      # Gradle plugin reads $ANDROID_USER_HOME/debug.keystore). The release
      # key never reaches a pull request or main build: release.yml signs the
      # release APK in its own job (docs/android-signing-key-backup.md), so a
      # CI APK does not install over a released app. Pull requests run code
      # from their branch, which could read any key on this runner.
      - name: Make a throwaway signing key
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      # MAPTILER_KEY gives the sideloaded app its satellite map tiles (FET-27).
      # The build number (Android versionCode) is the commit count, as in
      # release.yml, so a later build from main or a release installs over an
      # earlier one and Android never sees a downgrade.
      - name: Build Android APK (release, sideloadable)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          flutter build apk --release --build-number="$(git rev-list --count HEAD)" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
      # JVM unit tests of the native code (android/app/src/test), such as the
      # bounded copy of shared and picked files. The APK build made gradlew.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      # Fails if the APK was signed with any key but this run's throwaway key,
      # or with the release key (it must not be on this runner at all).
      - name: Check the APK's signing key
        run: |
          expected=$(.github/scripts/keystore-cert.sh ~/.android/debug.keystore)
          actual=$(.github/scripts/apk-cert.sh build/app/outputs/flutter-apk/app-release.apk)
          echo "Signing key SHA-256: $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            echo "::error::The APK is signed with '$actual', not this run's key $expected."
            exit 1
          }
          release_cert=7315a93ded2e4bea6878e3e568d1f517913eb313493a6bd2b116431f8969cc4f
          [ "$actual" != "$release_cert" ] || {
            echo "::error::The APK is signed with the release key; CI must never have it."
            exit 1
          }
      # The step release.yml uses to sign (sign-apk.sh), run with a second
      # throwaway key: re-signing must replace the signature and keep the APK valid.
      - name: Re-signing test
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/other.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Other,O=Android,C=US"
          .github/scripts/sign-apk.sh build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/other.keystore" "$RUNNER_TEMP/resigned.apk"
          first=$(.github/scripts/apk-cert.sh build/app/outputs/flutter-apk/app-release.apk)
          second=$(.github/scripts/apk-cert.sh "$RUNNER_TEMP/resigned.apk")
          [ "$first" != "$second" ] || { echo "::error::Re-signing did not change the certificate."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: flappedear-telemetry-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Apache-2.0, ReactiveCircus/android-emulator-runner.
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # The guest has no Vulkan, so Flutter draws with OpenGL ES on
          # SwiftShader instead of SwiftShader's emulated Vulkan; runs that
          # never got past the splash screen had the emulated Vulkan.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/android-integration-test.sh
