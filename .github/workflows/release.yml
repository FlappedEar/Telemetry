name: Release

# Publishes a GitHub Release with the Android APK, the macOS app and the
# Windows app (a zip and an NSIS installer).
#
# Start it either way:
# - push a tag such as v0.1.0 on main, or
# - run this workflow from the Actions tab on main and give the version
#   (0.1.0); the release then creates the tag v0.1.0 at that commit.
# The version must be the one in pubspec.yaml (version: 0.1.0+...).
# Versions below 1.0.0 are marked as pre-releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in pubspec.yaml (for example 0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so it needs the history.
          fetch-depth: 0
      - name: Version from the tag or the input, checked against pubspec.yaml
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            # A tag off main could carry a build number main reaches later.
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::The tag $GITHUB_REF_NAME is not on main."; exit 1; }
          else
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run the release from main."; exit 1; }
            version="${INPUT_VERSION#v}"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::'$version' is not a version like 0.1.0."; exit 1; }
          declared=$(sed -n 's/^version: \([0-9.]*\)+.*$/\1/p' pubspec.yaml)
          [ "$declared" = "$version" ] \
            || { echo "::error::pubspec.yaml declares $declared, not $version."; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::The tag v$version already exists."; exit 1
          fi
          # Same build number as the CI build of this commit (see ci.yml), so
          # Android installs a later build over an earlier one.
          build=$(git rev-list --count HEAD)
          echo "Version $version, build $build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      # The APK is signed with the same key as the APKs from main's CI runs
      # (ci.yml), kept in the Actions cache, so it installs over them and keeps
      # the app's data. Without that key the release stops rather than sign
      # with a new one, which would make the phone refuse the update.
      - name: Restore the signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      # The backup copy in the repository secret (docs/android-signing-key-backup.md),
      # used when the cache is gone. The check below still pins the certificate.
      - name: Restore the key from the repository secret
        id: secret
        if: steps.key.outputs.cache-hit != 'true'
        uses: ./.github/actions/signing-key-from-secret
        with:
          expected-sha256: 7315a93ded2e4bea6878e3e568d1f517913eb313493a6bd2b116431f8969cc4f
          keystore-base64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      - name: Stop if the signing key is missing
        if: steps.key.outputs.cache-hit != 'true' && steps.secret.outputs.restored != 'true'
        run: |
          echo "::error::The signing key (cache android-debug-keystore-v1, secret ANDROID_DEBUG_KEYSTORE_BASE64) was not restored. Back it up as docs/android-signing-key-backup.md says, then release again."
          exit 1
      - run: echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
      - name: Build the APK (release)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          [ -n "$MAPTILER_KEY" ] || echo "::warning::MAPTILER_KEY is not set; this APK shows street tiles only."
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
      # The certificate of the APKs on the owner's phone since 3974d07. If
      # the cache ever holds a different key (it expired and CI made a new
      # one), the release stops instead of publishing an APK that the phone
      # would refuse as an update.
      - name: Check the APK's signing key
        env:
          RELEASE_CERT_SHA256: 7315a93ded2e4bea6878e3e568d1f517913eb313493a6bd2b116431f8969cc4f
        run: |
          expected=$(keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          java_home="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          certs=$(JAVA_HOME="$java_home" PATH="$java_home/bin:$PATH" "$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk 2>&1) || true
          actual=$(printf '%s\n' "$certs" \
            | sed -n -E 's/^(Signer #1|V[0-9]+ Signer):? certificate SHA-256 digest: //p' \
            | head -n 1)
          echo "Signing key SHA-256: $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            printf '%s\n' "$certs"
            echo "::error::The APK is signed with '$actual', not the cached key $expected."
            exit 1
          }
          [ "$actual" = "$RELEASE_CERT_SHA256" ] || {
            echo "::error::The signing key is $actual, not the release key $RELEASE_CERT_SHA256 that installed apps have."
            exit 1
          }
      - name: Name the APK
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/FlappedEar-Telemetry-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      # Signed ad hoc (no Apple developer account yet), not notarized: the
      # user guide's Install page says how to open it the first time.
      - name: Build the app (release)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          [ -n "$MAPTILER_KEY" ] || echo "::warning::MAPTILER_KEY is not set; this app shows street tiles only."
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
      - name: Check the signature and zip the app
        run: |
          app="build/macos/Build/Products/Release/FlappedEar Telemetry.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          mkdir dist
          # ditto keeps the bundle's symlinks and signature intact.
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/FlappedEar-Telemetry-${{ needs.version.outputs.version }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows app
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      # Not code-signed (no certificate yet): Windows SmartScreen warns on the
      # first start, which the user guide's Install page explains.
      - name: Build the app (release)
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          [ -n "$MAPTILER_KEY" ] || echo "::warning::MAPTILER_KEY is not set; this app shows street tiles only."
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"
      # The Visual C++ runtime goes next to the exe (as Flutter's Windows
      # guide advises), so the app starts on a PC that never installed it.
      - name: Zip the app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          release=build/windows/x64/runner/Release
          [ -f "$release/telemetry.exe" ] || { echo "::error::$release/telemetry.exe was not built."; exit 1; }
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" "$release/" \
              || { echo "::error::$dll was not found on the runner."; exit 1; }
          done
          name="FlappedEar-Telemetry-$VERSION-windows"
          mkdir -p dist "stage/$name"
          cp -r "$release"/. "stage/$name/"
          (cd stage && 7z a -tzip -bd "../dist/$name.zip" "$name" >/dev/null)
      # The same files as an installer (windows/installer/installer.nsi):
      # per-user, no administrator rights, Start menu entry and uninstaller.
      - name: Build the installer (NSIS)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          makensis=$(command -v makensis || true)
          [ -n "$makensis" ] || makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -x "$makensis" ]; then
            choco install nsis -y --no-progress
            makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          # -D (not /D): Git Bash would rewrite a leading slash as a path.
          "$makensis" -V2 -DVERSION="$VERSION" \
            -DSOURCE_DIR="$(cygpath -w "$PWD/build/windows/x64/runner/Release")" \
            -DOUTFILE="$(cygpath -w "$PWD/dist/FlappedEar-Telemetry-$VERSION-windows-setup.exe")" \
            windows/installer/installer.nsi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [version, android, macos, windows]
    # Android comes first: the release goes out with the APK even when the
    # Mac or Windows build fails. Re-running the failed jobs then adds the
    # missing zip to the existing release and refreshes SHA256SUMS.txt.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the release notes are needed from the repository.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release, or add to it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          [ "$MACOS_RESULT" = success ] || echo "::warning::The macOS build did not succeed; the release lacks the Mac zip."
          [ "$WINDOWS_RESULT" = success ] || echo "::warning::The Windows build did not succeed; the release lacks the Windows zip."
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run: keep the assets already published that this run did
            # not rebuild, so the checksums cover every file.
            mkdir -p published
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published \
              --pattern 'FlappedEar-Telemetry-*'
            for f in published/*; do
              [ -e "dist/$(basename "$f")" ] || cp "$f" dist/
            done
            ls -l dist
            (cd dist && shasum -a 256 FlappedEar-Telemetry-* > SHA256SUMS.txt)
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          ls -l dist
          (cd dist && shasum -a 256 FlappedEar-Telemetry-* > SHA256SUMS.txt)
          prerelease=
          case "$VERSION" in 0.*) prerelease=--prerelease ;; esac
          # The written notes for this version (docs/release-notes/vX.Y.Z.md)
          # come first when there are any; GitHub's list of merged pull
          # requests follows either way.
          notes="docs/release-notes/v$VERSION.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "Install steps: https://flappedear.github.io/Telemetry/install.html"
          } > "$RUNNER_TEMP/notes.md"
          # GitHub may skip pre-releases when it picks the previous release;
          # start the list of pull requests at the newest release there is.
          since=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
            --exclude-drafts --json tagName --jq '.[0].tagName // ""')
          start=()
          [ -n "$since" ] && start=(--notes-start-tag "$since")
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FlappedEar Telemetry $VERSION" \
            --generate-notes "${start[@]}" $prerelease \
            --notes-file "$RUNNER_TEMP/notes.md"
